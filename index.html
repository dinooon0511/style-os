<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f4f0" />
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <title>STYLE OS — Персональный гардероб</title>
  <style>
    :root{
      --bg:#ece6dd;
      --bg-2:#f4f0e8;
      --sand:#d8d0c2;
      --olive:#6e7566;
      --olive-deep:#454b40;
      --text:#1d201b;
      --muted:#6d716a;
      --line:rgba(59,64,54,.09);
      --white:rgba(255,255,255,.72);
      --glass:rgba(255,255,255,.44);
      --glass-strong:rgba(255,255,255,.62);
      --shadow:0 20px 40px rgba(20,24,18,.08), 0 6px 18px rgba(20,24,18,.04);
      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-sm:14px;
      --tabbar-h:84px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;color:var(--text);background:
      radial-gradient(circle at 12% 12%, rgba(232,219,205,.7), transparent 20%),
      radial-gradient(circle at 85% 16%, rgba(208,216,205,.72), transparent 22%),
      linear-gradient(180deg, #f3eee6 0%, #e8e1d5 100%);
    }
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,.14), transparent 16%, transparent 84%, rgba(255,255,255,.1));}
    .app{
      min-height:100dvh; display:flex; justify-content:center; padding:18px 12px 28px;
    }
    .phone{
      position:relative; width:100%; max-width:430px; min-height:calc(100dvh - 36px); background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,.16));
      border:1px solid rgba(255,255,255,.62); border-radius:40px; overflow:hidden; box-shadow:0 30px 70px rgba(26,31,24,.12), inset 0 1px 0 rgba(255,255,255,.45);
      backdrop-filter: blur(20px);
    }
    .notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:136px; height:30px; border-radius:0 0 18px 18px; background:rgba(19,21,18,.95); z-index:30; box-shadow:0 6px 14px rgba(0,0,0,.14)}
    .statusbar{position:absolute; top:14px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; z-index:31; color:#fff; font-size:12px; font-weight:600; mix-blend-mode:difference; pointer-events:none}
    .statusbar .icons{display:flex; gap:6px; align-items:center}
    .statusbar .bar{width:18px;height:9px;border:1.8px solid currentColor;border-radius:3px; position:relative}
    .statusbar .bar::after{content:"";position:absolute;right:-3.6px;top:2px;width:2.2px;height:3.4px;background:currentColor;border-radius:0 1px 1px 0}
    .statusbar .fill{position:absolute;inset:1.6px 4px 1.6px 1.6px;background:currentColor;border-radius:1px}
    .screen{display:none; min-height:100%; padding:54px 18px calc(var(--tabbar-h) + 22px); position:relative;}
    .screen.active{display:block;}
    .screen.scroll{overflow:auto;}
    .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
    .brand{font:500 31px/1.02 Helvetica, Arial, sans-serif; letter-spacing:-1.5px}
    .subtle{font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted)}
    .avatar{width:40px;height:40px;border-radius:50%;background:#dce2db;display:grid;place-items:center;color:#647064;overflow:hidden;border:1px solid rgba(255,255,255,.72);cursor:pointer}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .hero{
      position:relative; overflow:hidden; border-radius:30px; min-height:330px; padding:18px; margin-bottom:14px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff;
      background:linear-gradient(180deg, rgba(35,38,32,.02), rgba(19,20,17,.56)), center/cover no-repeat url('https://drive.google.com/thumbnail?id=1fUmZKozn4HVMqI8n0IJA3HMmomQkoMpO&sz=w1600');
      box-shadow:var(--shadow);
    }
    .hero.small{min-height:190px; padding:16px; background-image:linear-gradient(180deg, rgba(35,38,32,.1), rgba(19,20,17,.52)), var(--hero-image, url('https://drive.google.com/thumbnail?id=1YBjEhD5N82QsQ_j0kYC2UnbIz0Uv1sxJ&sz=w1600'));}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.06), transparent 35%, transparent 70%, rgba(0,0,0,.08)); pointer-events:none}
    .glassTag{display:inline-flex; align-items:center; gap:6px; width:max-content; padding:8px 12px; border-radius:999px; font-size:11px; font-weight:700; color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(10px)}
    .hero h1,.hero h2{position:relative; z-index:2; margin:8px 0 8px; font:400 40px/1.02 Georgia, "Iowan Old Style", serif; letter-spacing:-1.6px; max-width:260px}
    .hero.small h2{font-size:28px; max-width:220px}
    .hero p{position:relative; z-index:2; margin:0 0 14px; color:rgba(245,245,240,.92); max-width:270px}
    .buttonRow{display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:2}
    .btn{border:none; outline:none; border-radius:999px; padding:13px 16px; min-height:44px; font-weight:700; cursor:pointer; transition:.18s ease; display:inline-flex; align-items:center; justify-content:center; gap:8px}
    .btn.primary{background:#fff; color:#1e211c; box-shadow:0 10px 22px rgba(14,18,14,.12)}
    .btn.dark{background:linear-gradient(180deg, #232722, #42483f); color:#fff}
    .btn.soft{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(10px)}
    .btn.line{background:rgba(255,255,255,.55); color:var(--olive-deep); border:1px solid rgba(255,255,255,.72)}
    .btn.small{padding:10px 12px; min-height:36px; font-size:12px}
    .btn.icon{width:44px; padding:0; min-height:44px}
    .section{margin:18px 0 0}
    .sectionHead{display:flex; align-items:end; justify-content:space-between; gap:10px; margin-bottom:10px}
    .sectionTitle{font:400 26px/1.05 Georgia, "Iowan Old Style", serif; letter-spacing:-.8px; margin:0}
    .sectionHint{color:var(--muted); font-size:13px; margin-top:4px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.34)); border:1px solid rgba(255,255,255,.72); box-shadow:var(--shadow); border-radius:24px; padding:14px}
    .chips{display:flex; gap:8px; overflow:auto; padding:2px 0 4px; scrollbar-width:none}
    .chip{white-space:nowrap; border-radius:999px; padding:10px 12px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,.7); background:rgba(255,255,255,.46); color:var(--muted); cursor:pointer}
    .chip.active{background:linear-gradient(180deg,#202420,#424840); color:#fff; border-color:transparent}
    .quickGrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
    .quickCard{padding:14px 12px; border-radius:22px; background:linear-gradient(180deg, rgba(255,255,255,.56), rgba(255,255,255,.34)); border:1px solid rgba(255,255,255,.68); box-shadow:var(--shadow)}
    .quickCard b{display:block; margin-top:8px}
    .quickCard span{font-size:12px; color:var(--muted)}
    .iconBadge{width:36px; height:36px; display:grid; place-items:center; border-radius:14px; background:linear-gradient(180deg, rgba(226,232,223,.88), rgba(243,235,228,.82));}
    .styleScroll,.recoScroll{display:grid; grid-auto-flow:column; grid-auto-columns:78%; gap:12px; overflow:auto; padding-bottom:4px; scroll-snap-type:x proximity; scrollbar-width:none}
    .styleCard,.recoCard{scroll-snap-align:start}
    .styleCard{position:relative; overflow:hidden; min-height:200px; border-radius:28px; padding:16px; color:#fff; background:linear-gradient(180deg, rgba(28,30,25,.08), rgba(23,25,20,.48)), center/cover no-repeat var(--img); box-shadow:var(--shadow)}
    .styleCard h3{position:absolute; left:16px; bottom:38px; margin:0; font:400 28px/1.02 Georgia, "Iowan Old Style", serif}
    .styleCard p{position:absolute; left:16px; bottom:14px; margin:0; font-size:12px; color:rgba(243,243,240,.9)}
    .styleCard .glassTag{position:absolute; top:14px; left:14px}
    .miniList{display:grid; gap:10px}
    .miniProduct{display:grid; grid-template-columns:76px 1fr auto; gap:12px; align-items:center; padding:10px; border-radius:20px; background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.3)); border:1px solid rgba(255,255,255,.65)}
    .miniProduct .thumb{width:76px; height:88px; border-radius:16px; background:linear-gradient(180deg, #f1ece5, #e2e8e1); display:grid; place-items:center; overflow:hidden}
    .miniProduct .meta b{display:block; margin-bottom:4px}
    .miniProduct .meta small{display:block; color:var(--muted)}
    .count{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .itemCard{overflow:hidden; border-radius:24px; background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.34)); border:1px solid rgba(255,255,255,.7); box-shadow:var(--shadow)}
    .itemVisual{height:170px; padding:12px; background:linear-gradient(180deg, rgba(243,239,233,.92), rgba(226,233,225,.88)); display:grid; place-items:center}
    .itemBody{padding:12px}
    .itemName{font-weight:700; margin-bottom:2px}
    .metaLine{font-size:12px; color:var(--muted)}
    .price{font-weight:700; margin-top:8px}
    .floatBtn{position:fixed; bottom:100px; right:max(24px, calc((100vw - min(430px, 100vw - 24px)) / 2 + 24px)); z-index:25; width:58px; height:58px; border-radius:50%; border:none; background:linear-gradient(180deg, #232722, #414840); color:#fff; box-shadow:0 18px 28px rgba(31,35,29,.26); font-size:28px}
    .tabbar{position:absolute; left:14px; right:14px; bottom:14px; height:68px; padding:8px; border-radius:28px; background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.46)); border:1px solid rgba(255,255,255,.78); backdrop-filter:blur(18px); box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(5,1fr); z-index:20}
    .tab{border:none; background:transparent; border-radius:20px; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10px; cursor:pointer}
    .tab svg{width:22px;height:22px}
    .tab.active{background:linear-gradient(180deg, #202420, #3e453d); color:#fff}
    .search{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:18px; background:rgba(255,255,255,.56); border:1px solid rgba(255,255,255,.72); box-shadow:var(--shadow)}
    .search input{border:none; outline:none; background:transparent; width:100%; color:var(--text)}
    .empty{padding:24px; text-align:center; color:var(--muted)}
    .sheetBackdrop{position:fixed; inset:0; background:rgba(21,24,20,.32); backdrop-filter:blur(6px); z-index:40; opacity:0; pointer-events:none; transition:.2s}
    .sheetBackdrop.show{opacity:1; pointer-events:auto}
    .sheet{position:fixed; left:50%; transform:translateX(-50%) translateY(110%); bottom:0; width:min(100%, 430px); max-height:86vh; overflow:auto; padding:18px 16px 24px; background:linear-gradient(180deg, #f6f2ea, #e6dfd3); border-radius:30px 30px 0 0; box-shadow:0 -20px 40px rgba(0,0,0,.18); z-index:41; transition:.28s cubic-bezier(.2,.8,.2,1)}
    .sheet.show{transform:translateX(-50%) translateY(0)}
    .sheetHandle{width:42px;height:5px;border-radius:999px;background:rgba(65,72,63,.18); margin:0 auto 14px}
    .sheetTitle{font:400 28px/1.02 Georgia, "Iowan Old Style", serif; margin:0 0 6px}
    .sheetSub{color:var(--muted); margin:0 0 14px}
    .sheetSection{margin-top:16px}
    .fields{display:grid; gap:10px}
    .field{display:grid; gap:6px}
    .field label{font-size:12px; color:var(--muted); font-weight:700}
    .field input,.field select{border:none; outline:none; border-radius:16px; padding:13px 14px; background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.76); color:var(--text)}
    .sheetFooter{display:flex; gap:10px; position:sticky; bottom:-24px; margin:16px -16px -24px; padding:12px 16px 18px; background:linear-gradient(180deg, rgba(246,242,234,.15), rgba(246,242,234,.95) 24%)}
    .sheetFooter .btn{flex:1}
    .outfitCard{overflow:hidden; border-radius:28px; background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.34)); border:1px solid rgba(255,255,255,.72); box-shadow:var(--shadow)}
    .outfitHero{position:relative; height:220px; padding:16px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; background:linear-gradient(180deg, rgba(35,39,33,.08), rgba(20,23,19,.54)), center/cover no-repeat var(--look);}
    .outfitHero h3{margin:8px 0 4px; font:400 30px/1.02 Georgia, "Iowan Old Style", serif}
    .outfitHero p{margin:0; color:rgba(246,245,241,.9)}
    .outfitBody{padding:14px}
    .itemPills{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
    .pill{padding:8px 10px; border-radius:999px; background:rgba(255,255,255,.52); border:1px solid rgba(255,255,255,.72); font-size:12px}
    .stateGood,.stateNeed{display:inline-flex; align-items:center; gap:6px; padding:8px 10px; border-radius:999px; font-size:12px; font-weight:700}
    .stateGood{background:rgba(110,128,107,.15); color:#4d6151}
    .stateNeed{background:rgba(198,171,120,.18); color:#745e36}
    .heroCaption{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .statGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
    .statCard{padding:14px; border-radius:22px; background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.34)); border:1px solid rgba(255,255,255,.7); box-shadow:var(--shadow)}
    .statValue{font:400 30px/1 Georgia, "Iowan Old Style", serif}
    .list{display:grid; gap:10px}
    .listRow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; border-radius:18px; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.72)}
    .helper{font-size:11px; color:var(--muted)}
    .photoBanner{height:170px; border-radius:24px; background:linear-gradient(180deg, rgba(35,39,33,.12), rgba(22,23,21,.42)), center/cover no-repeat url('https://drive.google.com/thumbnail?id=1_THcYl0w1AEiO3Xl7V0pP-YVGI2H9ZgZ&sz=w1600'); box-shadow:var(--shadow); padding:16px; color:#fff; display:flex; flex-direction:column; justify-content:flex-end}
    .onboarding{position:absolute; inset:0; z-index:50; background:linear-gradient(180deg, rgba(245,241,234,.84), rgba(230,224,214,.86)); backdrop-filter:blur(18px); display:none; padding:18px}
    .onboarding.show{display:block}
    .onbSlide{display:none; min-height:100%; padding:44px 6px calc(var(--tabbar-h) + 8px)}
    .onbSlide.active{display:flex; flex-direction:column}
    .onbHero{flex:1; border-radius:34px; overflow:hidden; position:relative; padding:18px; color:#fff; background:linear-gradient(180deg, rgba(35,39,33,.08), rgba(20,23,19,.54)), center/cover no-repeat var(--onb-img); box-shadow:var(--shadow)}
    .onbHero h2{position:absolute; left:18px; bottom:74px; right:18px; margin:0; font:400 44px/1.02 Georgia, "Iowan Old Style", serif; letter-spacing:-1.6px}
    .onbHero p{position:absolute; left:18px; bottom:28px; right:18px; margin:0; color:rgba(246,245,241,.92)}
    .choiceGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
    .choiceCard{padding:10px; border-radius:22px; background:rgba(255,255,255,.44); border:1px solid rgba(255,255,255,.72); box-shadow:var(--shadow); cursor:pointer}
    .choiceCard .pic{height:106px; border-radius:18px; background:center/cover no-repeat var(--img); margin-bottom:10px}
    .choiceCard.active{outline:2px solid rgba(59,64,54,.4); background:rgba(255,255,255,.66)}
    .toggleGrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px}
    .toggleCard{padding:12px; border-radius:20px; background:rgba(255,255,255,.42); border:1px solid rgba(255,255,255,.72); text-align:center; cursor:pointer}
    .toggleCard.active{background:linear-gradient(180deg,#202420,#3f463d); color:#fff}
    .fabSpacer{height:72px}
    .hidden{display:none!important}
    @media (max-width:390px){
      .brand{font-size:30px}.hero h1{font-size:34px}.sectionTitle{font-size:24px}.styleScroll,.recoScroll{grid-auto-columns:84%}
    }

/* STYLE OS / responsive editorial redesign — NO device frame */
:root{--bg:#f4f2ed;--bg-2:#f8f7f3;--sand:#e6e1d8;--olive:#626b58;--olive-deep:#394034;--text:#1c201a;--muted:#74766f;--line:#e5e3dd;--white:#fff;--glass:#fff;--glass-strong:#fff;--shadow:0 8px 25px rgba(28,33,27,.07);--radius-xl:25px;--radius-lg:20px;--radius-md:16px;--tabbar-h:82px}
html,body{font-family:Helvetica,Arial,sans-serif;background:#f5f4f0;font-size:14px;color:var(--text)}
body:before{display:none}
.app{padding:0;display:block;min-height:100dvh;background:transparent}
.shell{width:100%;max-width:1240px;min-height:100dvh;margin:0 auto;border:none;border-radius:0;overflow:visible;box-shadow:none;background:#f8f7f4;backdrop-filter:none;position:relative}
.screen{min-height:100dvh;padding:30px clamp(18px,4vw,52px) 135px;max-width:100%;overflow-x:clip}
.screen.active{display:block}
.brand{font-family:Helvetica,Arial,sans-serif;font-weight:500;font-size:30px;letter-spacing:4px;line-height:1.05;color:#22251f}
.subtle{font-size:10px;font-weight:600;letter-spacing:2px}
.topbar{margin:0 0 24px;align-items:center}
.section{margin-top:30px}.sectionHead{margin-bottom:15px;align-items:baseline}
.sectionTitle{font-family:Helvetica,Arial,sans-serif;font-size:24px;letter-spacing:-.9px;font-weight:600}
.sectionHint{font-size:12px}
.hero{min-height:440px;border-radius:26px; padding:32px;justify-content:center;background-image:linear-gradient(90deg,rgba(27,32,26,.72) 0%,rgba(31,35,28,.32) 48%,rgba(16,19,15,.02) 100%),url('https://drive.google.com/thumbnail?id=1fUmZKozn4HVMqI8n0IJA3HMmomQkoMpO&sz=w1600');background-position:center;box-shadow:none;border:none}
.hero h1,.hero h2{font-family:Helvetica,Arial,sans-serif;font-size:clamp(34px,4vw,55px);font-weight:500;letter-spacing:-1.9px;line-height:1.03;max-width:425px;margin:15px 0}
.hero p{max-width:320px;font-size:14px;color:#eeeee8;line-height:1.55}
.hero.small{min-height:240px;justify-content:flex-end;background-position:center}
.hero.small h2{font-size:28px;max-width:270px}
.glassTag{font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;background:rgba(255,255,255,.14)}
.btn{font-family:Helvetica,Arial,sans-serif;font-weight:600;box-shadow:none!important}.btn.dark,.chip.active,.tab.active,.toggleCard.active{background:#20251f;color:#fff}
.btn.primary{background:#f4f1e9;color:#242720}.btn.line{background:#f0efeb;color:#252c23;border:1px solid #e8e6e0}
.card,.quickCard,.statCard,.itemCard,.outfitCard,.miniProduct{box-shadow:none;border:1px solid #edeae5;background:#fff}
.quickGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quickCard{position:relative;min-height:155px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:20px;overflow:hidden;cursor:pointer;background-position:center;background-size:cover;color:#fff;border:none;padding:15px}
.quickCard:nth-child(1){background-image:linear-gradient(180deg,transparent 10%,rgba(24,27,22,.76)),url('https://drive.google.com/thumbnail?id=1X7I4ziALfQ2-XtSkG2b2ttl8mKfJcql2&sz=w1600')}
.quickCard:nth-child(2){background-image:linear-gradient(180deg,transparent 10%,rgba(24,27,22,.76)),url('https://drive.google.com/thumbnail?id=1Q6GQlQZOZBOJqWFq8C2Zr38gj_v9wBjP&sz=w1600')}
.quickCard:nth-child(3){background-image:linear-gradient(180deg,transparent 10%,rgba(24,27,22,.76)),url('https://drive.google.com/thumbnail?id=1RUhyGQNLUREGTKm52QzbG1W1sWL39kPJ&sz=w1600')}
.quickCard b{font-size:15px;margin-top:7px;line-height:1.08;text-shadow:0 1px 5px rgba(0,0,0,.2)}
.quickCard span{font-size:11px;color:rgba(255,255,255,.85);line-height:1.35;margin-top:5px}
.quickCard .iconBadge{background:rgba(255,255,255,.16);color:white;border:1px solid rgba(255,255,255,.27);border-radius:50%;width:30px;height:30px;backdrop-filter:blur(10px)}
.styleScroll,.recoScroll{grid-auto-columns:minmax(270px,33%);gap:14px;scroll-padding-inline:0}
.styleCard{border-radius:20px;min-height:245px;box-shadow:none}.styleCard h3{font-family:Helvetica,Arial,sans-serif;font-weight:600;font-size:25px}
.styleCard p{line-height:1.35}
.outfitHero{border-radius:0;height:240px}.outfitHero h3{font-family:Helvetica,Arial,sans-serif;font-size:27px;font-weight:600;letter-spacing:-.8px}
.statCard{border-radius:18px}.statValue{font-family:Helvetica,Arial,sans-serif;font-weight:600}
.grid2{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.itemCard{border-radius:17px;cursor:pointer}.itemVisual{height:205px;background:#edede9;padding:15px}
.itemBody{padding:12px}.itemName{font-size:13px}.metaLine{line-height:1.4}

  function compatibility(parts,style,weather,occasion){
    const tags=parts.map(itemTags),colors=tags.map(t=>t.color),reasons=[],warnings=[],fired=[];
    let score=32;
    const add=(id,delta,message)=>{score+=delta;fired.push(id);if(message&&delta>0)reasons.push(message);};
    if(colors.every(c=>['black','white','cream','beige','gray','charcoal','navy','brown','olive','blue'].includes(c)))add('C01',8,'Спокойная цветовая гамма связывает вещи.');
    if(PALETTES.some(p=>colors.every(c=>p.includes(c))))add('C02',7,'Оттенки образуют согласованную палитру.');
    if(new Set(colors).size<=3)add('C03',4,'Небольшое количество оттенков сохраняет цельность.');
    const top=tags.find(t=>t.group==='top'),bottom=tags.find(t=>t.group==='bottom'),shoes=tags.find(t=>t.group==='shoes'),layer=tags.find(t=>t.group==='layer');
    if(bottom?.volume==='wide'){
      if(top?.volume!=='wide')add('P01',9,'Собранный верх балансирует свободные брюки.');
      else if(top)add('P02',4,'Свободные силуэты образуют расслабленный комплект.');
      if(layer?.structured)add('P03',5,'Структурный верхний слой поддерживает пропорции.');
    }
    if(bottom&&shoes){
      if(bottom.formality>=2&&shoes.formality>=2)add('F01',8,'Обувь согласована с формальностью брюк.');
      if(bottom.formality<=1&&shoes.formality<=1)add('F02',6,'Повседневный низ и обувь сочетаются по стилю.');
      if(Math.abs(bottom.formality-shoes.formality)>=3)add('F04',-8);
    }
    if(tags.some(t=>t.type==='shirt')&&tags.some(t=>t.type==='knit'))add('L01',5,'Рубашка и трикотаж создают гармоничную многослойность.');
    const mode=STYLE_MODES[style]||STYLE_MODES.casual;
    add('S01',Math.round(tags.filter(t=>mode.types.includes(t.type)).length/tags.length*12));
    add('S02',Math.round(tags.filter(t=>mode.colors.includes(t.color)).length/tags.length*7));
    if(weather==='hot'&&tags.some(t=>['coat','hoodie'].includes(t.type))){add('W01',-28);warnings.push('В жару верхний слой может быть слишком тёплым.');}
    if(weather==='cold'&&!tags.some(t=>['coat','jacket','overshirt','hoodie','knit'].includes(t.type))){add('W02',-18);warnings.push('Для холода желательно добавить утепляющий слой.');}
    if(occasion==='office'&&tags.some(t=>t.type==='shorts'))add('O01',-22);
    if(tags.filter(t=>t.group==='bottom').length!==1||tags.filter(t=>t.group==='shoes').length!==1)add('X01',-30);
    return {score:Math.max(0,Math.min(100,score)),explanations:[...new Set(reasons)].slice(0,3),warnings,rules:fired};
  }
  function preferenceBonus(parts,style){
    let feedback=store.feedback||[],bonus=0;const ids=new Set(parts.map(x=>x.catalogId||x.id));
    for(const v of feedback){let overlap=(v.items||[]).filter(id=>ids.has(id)).length;bonus+=(v.value===1?1:-1)*overlap*2;if(v.style===style)bonus+=(v.value===1?2:-2);}
    return Math.max(-12,Math.min(12,bonus));
  }

  function generateLooks({occasion,weather,ownedOnly=false,limit=5,mix=false}){
    const owned=ownItems(),catalog=state.catalog,preferred=getStyleMode();
    const occasionStyles={
      everyday:['casual','minimal','utility','dark_minimal','oldmoney','smart'],
      office:['classic','soft_tailoring','smart','minimal','oldmoney'],
      date:['oldmoney','smart','soft_tailoring','minimal','casual','classic'],
      restaurant:['classic','soft_tailoring','oldmoney','smart','minimal'],
      travel:['casual','utility','minimal','summer_relaxed','dark_minimal']
    };
    const styles=[...(occasionStyles[occasion]||occasionStyles.everyday),preferred].filter((x,i,a)=>a.indexOf(x)===i&&STYLE_MODES[x]).slice(0,6);
    const allowed=(x,group)=>{
      if(weather==='hot')return !['knit','hoodie','coat','jacket','blazer','overshirt','boots'].includes(x.type)&&x.season!=='cold';
      if(weather==='cold')return x.type!=='shorts'&&x.season!=='warm'&&(group!=='layer'||['coat','jacket','overshirt'].includes(x.type));
      return x.type!=='coat'&&x.season!=='cold';
    };
    const pools={};
    for(const group of ['top','bottom','shoes','layer']){
      const own=owned.filter(x=>GROUP[x.type]===group&&allowed(x,group)).map(x=>({...x,missing:false}));
      const ids=new Set(own.map(x=>x.id));
      const suggestions=ownedOnly?[]:catalog.filter(x=>GROUP[x.type]===group&&!ids.has(x.id)&&allowed(x,group)).map(x=>({...x,missing:true}));
      pools[group]=[...own,...suggestions];
    }
    // Every owned bottom is kept in consideration, irrespective of catalogue ranking.
    const candidates=[],seen=new Set();
    const key=x=>x.ownedId||x.catalogId||x.id;
    const pick=(group,style,limit)=>[...pools[group]].sort((a,b)=>
      Number(a.missing)-Number(b.missing)||
      Number(STYLE_MODES[style].types.includes(b.type))-Number(STYLE_MODES[style].types.includes(a.type))||
      Number(STYLE_MODES[style].colors.includes(b.color))-Number(STYLE_MODES[style].colors.includes(a.color))
    ).slice(0,limit);
    for(const style of styles){
      const tops=pick('top',style,ownedOnly?12:9),bottoms=pick('bottom',style,ownedOnly?100:24),shoes=pick('shoes',style,ownedOnly?10:6),layers=pick('layer',style,ownedOnly?12:9);
      // Base shirt / tee can sit beneath knitwear; outerwear is a separate layer.
      const bases=tops.filter(x=>!['knit','hoodie'].includes(x.type));
      const mids=tops.filter(x=>['knit','hoodie'].includes(x.type));
      const shells=layers.filter(x=>['coat','jacket','blazer'].includes(x.type));
      const overs=layers.filter(x=>x.type==='overshirt');
      const variants=[];
      for(const base of tops)variants.push([base]);
      for(const base of bases.slice(0,8))for(const mid of mids.slice(0,6)){
        if(key(base)===key(mid))continue;
        if(base.type==='shirt'&&['turtleneck','sweater'].includes(mid.subtype))continue;
        variants.push([base,mid]);
      }
      for(const base of bases.slice(0,5))for(const mid of mids.slice(0,4))for(const over of overs.slice(0,2)){
        if(base.type==='shirt'&&['turtleneck','sweater'].includes(mid.subtype))continue;
        variants.push([base,mid,over]);
      }
      variants.sort((a,b)=>Number(a.some(x=>x.type==='shirt'))-Number(b.some(x=>x.type==='shirt'))||a.length-b.length);
      // Include coat over a shirt and knit layer; five pieces total including trousers and shoes.
      const outerOptions=weather==='hot'?[null]:weather==='cold'?shells.filter(x=>['coat','jacket'].includes(x.type)):[null,...shells,...overs];
      if(weather==='cold'&&!outerOptions.length)continue;
      for(const base of variants.slice(0,42))for(const bottom of bottoms)for(const shoe of shoes)for(const outer of outerOptions.slice(0,5)){
        const parts=[...base,bottom,shoe,...(outer?[outer]:[])];
        if(new Set(parts.map(key)).size!==parts.length)continue;
        if(parts.length>6)continue;
        if(ownedOnly&&parts.some(p=>p.missing))continue;
        if(weather==='cold'&&!outer)continue;
        if(weather==='mild'&&!outer&&!base.some(p=>['knit','hoodie'].includes(p.type)))continue;
        const id=parts.map(key).sort().join('|');
        if(seen.has(id))continue;seen.add(id);
        const missing=parts.filter(p=>p.missing),ev=compatibility(parts,style,weather,occasion);
        let score=ev.score+preferenceBonus(parts,style)-missing.length*11;
        if(base.length>1&&base.some(p=>p.type==='shirt')&&base.some(p=>p.type==='knit'&&!['turtleneck','sweater'].includes(p.subtype)))score+=6;
        if(base.length>1&&base.some(p=>p.type==='shirt')&&base.some(p=>['turtleneck','sweater'].includes(p.subtype)))score-=24;
        const formalShoe=['loafers','derby'].includes(shoe.type);
        const tailoredBottom=['trousers','chinos'].includes(bottom.type);
        const relaxedBottom=['jeans','joggers','shorts'].includes(bottom.subtype||bottom.type)||bottom.type==='jeans'||bottom.type==='shorts';
        if(occasion==='office')score+=(tailoredBottom?16:-10)+(formalShoe?11:-7)+(['blazer','coat'].includes(outer?.type)?6:0)+(base.some(p=>p.type==='shirt')?5:0);
        if(occasion==='restaurant')score+=(tailoredBottom?17:-6)+(formalShoe?13:-8)+(['blazer','coat'].includes(outer?.type)?10:0)+(base.some(p=>p.type==='shirt')?7:0);
        if(occasion==='date')score+=(tailoredBottom?8:0)+(formalShoe?5:0)+(base.some(p=>['shirt','polo','knit'].includes(p.type))?8:0)+(base.some(p=>p.type==='hoodie')?-12:0);
        if(occasion==='everyday')score+=(relaxedBottom?10:0)+(shoe.type==='sneakers'?10:0)+(base.length===1?8:0)+(base.some(p=>p.type==='shirt')?-5:0);
        if(occasion==='travel')score+=(relaxedBottom?10:0)+(shoe.type==='sneakers'?13:-5)+(base.some(p=>p.type==='hoodie')?5:0);
        if(outer?.type==='coat'&&bottom.type==='trousers')score+=12;
        if(outer?.type==='coat'&&bottom.type==='jeans'){
          const fit=normalizeFit(bottom);
          if(['wide','relaxed','straight','baggy'].includes(fit))score+=9;
          else if(['slim','skinny'].includes(fit))score-=5;
          else score+=3;
        }
        if(weather==='cold'&&base.some(p=>['knit','hoodie'].includes(p.type)))score+=8;
        if(['office','restaurant'].includes(occasion)&&['classic','smart','soft_tailoring'].includes(style))score+=5;
        if(score<42)continue;
        candidates.push({id:'v2_'+candidates.length,title:STYLE_MODES[style].label,style,occasion,weather,parts,missing,
          score:Math.max(0,Math.min(100,score)),reason:ev.explanations.join(' ')||'Сочетание по типу, цвету и силуэту.',
          explanations:ev.explanations,warnings:ev.warnings,rules:ev.rules,identity:id});
      }
    }
    candidates.sort((a,b)=>b.score-a.score||a.missing.length-b.missing.length);
    // Diversify bottoms and silhouettes; for Explore mix ready and shopping looks.
    const selected=[],used=new Map(),usedLooks=new Set();
    const selectFrom=(pool,count)=>{
      for(let n=0;n<count;n++){
        let best=null,bestRank=-Infinity;
        for(const look of pool.slice(0,6500)){
          if(usedLooks.has(look.identity))continue;
          const bottom=look.parts.find(p=>GROUP[p.type]==='bottom');
          const bottomId=key(bottom),repeat=used.get(bottomId)||0;
          const overlap=selected.reduce((max,l)=>Math.max(max,look.parts.filter(p=>l.parts.some(z=>key(z)===key(p))).length),0);
          const usedShirts=selected.filter(l=>l.parts.some(p=>p.type==='shirt')).length;
          const rank=look.score-repeat*24-overlap*5+(bottom.type==='trousers'?3:0)-
            (look.parts.some(p=>p.type==='shirt')?usedShirts*9:0);
          if(rank>bestRank){bestRank=rank;best=look;}
        }
        if(!best)break;
        selected.push(best);usedLooks.add(best.identity);
        const bottom=best.parts.find(p=>GROUP[p.type]==='bottom'),id=key(bottom);
        used.set(id,(used.get(id)||0)+1);
      }
    };
    if(mix&&!ownedOnly){
      const ready=candidates.filter(l=>l.missing.length===0);
      const shopping=candidates.filter(l=>l.missing.length>0);
      selectFrom(ready,Math.ceil(limit/2));
      selectFrom(shopping,Math.floor(limit/2));
      if(selected.length<limit)selectFrom(candidates,limit-selected.length);
    }else selectFrom(candidates,limit);
    return selected;
  }

  function weatherMode(temp,wind,low=temp,rain=0){return temp<=15||low<=10||(wind>=30&&temp<=18)||(rain>=4&&temp<=17)?'cold':temp>=23&&low>=17?'hot':'mild';}

      const high=j.daily.temperature_2m_max[i],low=j.daily.temperature_2m_min[i],wind=j.daily.wind_speed_10m_max[i],rain=j.daily.precipitation_sum[i];

    card.style.transform='translateX('+(value==='like'?110:-110)+'vw) rotate('+(value==='like'?18:-18)+'deg)';

  function initDailySwipe(){
    const card=document.getElementById('dailySwipe');if(!card)return;
    let startX=0,startY=0,active=false,dragging=false;
    card.addEventListener('pointerdown',e=>{
      if(e.button!==0||card.dataset.leaving==='yes')return;
      active=true;dragging=false;startX=e.clientX;startY=e.clientY;
      card.style.transition='none';
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove',e=>{
      if(!active)return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      if(Math.abs(dy)>Math.abs(dx)*1.5&&!dragging)return;
      if(Math.abs(dx)>7)dragging=true;
      if(!dragging)return;
      card.style.transform='translateX('+dx+'px) rotate('+(dx/22)+'deg)';
      const left=card.querySelector('.dailySwipeNo'),right=card.querySelector('.dailySwipeYes');
      if(left)left.style.opacity=String(Math.min(1,Math.max(0,-dx/90)));
      if(right)right.style.opacity=String(Math.min(1,Math.max(0,dx/90)));
    });
    const finish=e=>{
      if(!active)return;active=false;
      const dx=e.clientX-startX;
      if(dragging&&Math.abs(dx)>85){animateDailyVote(dx>0?'like':'dislike');return;}
      card.style.transition='transform 220ms ease';
      card.style.transform='translateX(0) rotate(0)';
      for(const x of card.querySelectorAll('.dailySwipeNo,.dailySwipeYes'))x.style.opacity='0';
    };
    card.addEventListener('pointerup',finish);
    card.addEventListener('pointercancel',()=>{active=false;card.style.transition='transform 220ms ease';card.style.transform='';});
  }

  function findSavedLook(id){
    if(store.savedLookDetails?.[id]?.parts?.length)return store.savedLookDetails[id];
    for(const occasion of ['everyday','office','date','restaurant','travel','event','university']){
      for(const weather of ['cold','mild','hot']){
        const match=generateLooks({occasion,weather,ownedOnly:false,limit:30,mix:true}).find(l=>l.id===id);
        if(match){store.savedLookDetails??={};store.savedLookDetails[id]=match;saveStore();return match;}
      }
    }
    return null;
  }

  function appAction(action,payload){
    if(action==='closeSheet'){ closeSheet(); }
    if(action==='openCity'){openSheet('city');}
    if(action==='setCityManual'){setCityManual();}
    if(action==='cityInput'){onCityInput(payload);}
    if(action==='chooseCity'){chooseCity(Number(payload));}
    if(action==='setCityGps'){setCityGps();}
    if(action==='dailyVote'){animateDailyVote(payload);}
    if(action==='dailyPreview'){const l=dailyOptions().find(x=>x.identity===payload);if(l)openSheet('dailyPreview',l);}
    if(action==='dailyBack'){openSheet('daily');}
    if(action==='dailyChoose'){dailyChoose(payload);}
    if(action==='dailyReset'){store.daily=null;saveStore();openSheet('daily');}
    if(action==='rechooseDaily'){store.daily=null;saveStore();openSheet('daily');}
    if(action==='dailyOutfits'){closeSheet();state.screen='outfits';renderScreens();}
    if(action==='saveProfile'){
      store.profile.name=document.getElementById('profileName').value.trim()||'Пользователь';
      store.profile.style=document.getElementById('profileStyle').value;
      store.profile.topSize=document.getElementById('profileTop').value;
      store.profile.bottomSize=document.getElementById('profileBottom').value;
      store.profile.shoeSize=document.getElementById('profileShoe').value;
      store.profile.budget=document.getElementById('profileBudget').value;
      saveStore(); closeSheet();renderScreens();toast('Настройки сохранены');
    }
    if(action==='removeSaved'){ store.savedLooks=store.savedLooks.filter(x=>x!==payload);if(store.savedLookDetails)delete store.savedLookDetails[payload];saveStore();openSheet('savedLooks');renderScreens(); }
    if(action==='switchTab'){ state.screen=payload; closeSheet(); renderScreens(); }
    if(action==='setWardrobeFilter'){ state.filters.wardrobe=payload; renderWardrobe(); }
    if(action==='setCatalogFilter'){ state.filters.catalog=payload; renderCatalog(); }
    if(action==='setOccasion'){ state.filters.outfitOccasion=payload; renderHome(); renderOutfits(); }
    if(action==='setOwnedOnly'){state.filters.ownedOnly=payload==='true';renderOutfits();}
    if(action==='setWeather'){ state.filters.outfitWeather=payload; renderHome(); renderOutfits(); }
    if(action==='searchCatalog'){ state.filters.catalogSearch=payload; const input=document.activeElement; const at=input && input.selectionStart; renderCatalog(); const next=document.querySelector('#catalogScreen .search input'); if(next){next.focus(); if(at!==null) next.setSelectionRange(at,at); } }
    if(action==='openAdd'){ state.addQuery='';state.addCategory='all';openSheet('addItem'); }
    if(action==='addCategory'){state.addCategory=payload;openSheet('addItem');}
    if(action==='addSearch'){state.addQuery=payload;const input=document.activeElement;const at=input?.selectionStart;openSheet('addItem');const next=document.getElementById('addSearch');if(next){next.focus();try{next.setSelectionRange(at,at)}catch(e){}}}
    if(action==='manualForm'){ openSheet('manualForm'); }
    if(action==='saveManual'){
      const item={id:'manual_'+Date.now(), ownedId:'manual_'+Date.now(), brand:'Моя вещь', name:document.getElementById('manualName').value || 'Новая вещь', type:document.getElementById('manualType').value, color:document.getElementById('manualColor').value, fit:document.getElementById('manualFit').value, season:document.getElementById('manualSeason').value, material:'', sku:'', price:null, url:''};
      store.wardrobe.unshift(item); saveStore(); closeSheet(); toast('Вещь добавлена'); renderScreens();
    }
    if(action==='openOwned'){ const item=store.wardrobe.find(i=>i.ownedId===payload); if(item) openSheet('item',item); }
    if(action==='openProduct'){ const item=state.catalog.find(i=>i.id===payload); if(item) openSheet('product',item); }
    if(action==='addFromCatalog'){
      const item=state.catalog.find(i=>i.id===payload); if(!item) return;
      if(store.wardrobe.some(w=>w.id===item.id || w.catalogId===item.id)){ toast('Эта вещь уже есть в гардеробе'); return; }
      store.wardrobe.unshift({...item, ownedId:'own_'+item.id, catalogId:item.id, source:'catalog'}); saveStore(); toast('Добавлено в гардероб'); closeSheet(); renderScreens();
    }
    if(action==='copySku'){
      const item=state.catalog.find(i=>i.id===payload); if(!item) return; navigator.clipboard?.writeText(item.sku || ''); toast('Артикул скопирован');
    }
    if(action==='openLookPart'||action==='openLeadPart'){
      const look=action==='openLeadPart'?todayLooks()[0]:(state.sheet?.kind==='look'?state.sheet.payload:null);
      const part=look?.parts[Number(payload)];
      if(part){
        const full=state.catalog.find(c=>c.id===(part.catalogId||part.id));
        openSheet(part.missing?'product':'item',part.missing?(full||part):part);
      }
    }
    if(action==='openOutfitPart'){
      const [id,index]=String(payload).split(':');
      const look=todayLooks().find(x=>x.id===id);
      const part=look?.parts[Number(index)];
      if(part){
        const full=state.catalog.find(x=>x.id===(part.catalogId||part.id));
        openSheet(part.missing?'product':'item',part.missing?(full||part):part);
      }
    }
    if(action==='rateLook'){
      const look=state.sheet?.kind==='look'?state.sheet.payload:null;
      if(look){store.feedback.push({items:look.parts.map(p=>p.catalogId||p.id),style:look.style,value:payload==='like'?1:-1});
        store.feedback=store.feedback.slice(-100);saveStore();closeSheet();renderScreens();toast('Спасибо! Учтём в следующих образах.');}
    }
    if(action==='openLeadLook'){const chosen=chosenDaily();if(chosen)openSheet('look',chosen);else openSheet('daily');}
    if(action==='openLook'){ const look=todayLooks().find(l=>l.id===payload); if(look) openSheet('look',look); }
    if(action==='saveLook'){
      const look=state.sheet?.kind==='look'?state.sheet.payload:todayLooks().find(l=>l.id===payload);
      if(look){if(!store.savedLooks.includes(payload))store.savedLooks.push(payload);
        store.savedLookDetails??={};store.savedLookDetails[payload]=JSON.parse(JSON.stringify(look));
        saveStore();toast('Образ сохранён');closeSheet();renderScreens();}
    }
    if(action==='shoppingFromLook'){ state.screen='catalog'; closeSheet(); renderScreens(); }
    if(action==='removeOrCopy'){
      const owned=store.wardrobe.find(i=>i.ownedId===payload);
      if(owned){ store.wardrobe = store.wardrobe.filter(i=>i.ownedId!==payload); saveStore(); toast('Вещь удалена'); closeSheet(); renderScreens(); }
    }
    if(action==='buildFromItem'){ state.screen='outfits'; closeSheet(); renderScreens(); }
    if(action==='shuffle'){ const keys=['everyday','office','date','restaurant','travel'];state.filters.outfitOccasion=keys[(keys.indexOf(state.filters.outfitOccasion)+1)%keys.length];renderHome();renderOutfits(); }
    if(action==='editProfile'){ openSheet('editProfile'); }
    if(action==='openSaved'){ openSheet('savedLooks'); }
    if(action==='viewSaved'){const look=findSavedLook(payload);if(look)openSheet('look',look);}
    if(action==='chooseAvatar'){document.getElementById('profileAvatarFile')?.click();}
    if(action==='skipOnboarding'){ store.onboarded=true; if(!store.wardrobe.length) store.wardrobe=seedWardrobe(state.catalog); saveStore(); document.getElementById('onboarding').classList.remove('show'); renderScreens(); }
    if(action==='nextOnboarding'){ state.onboardingController.showStep(Math.min(2, state.onboardingController.current+1)); }
    if(action==='prevOnboarding'){ state.onboardingController.showStep(Math.max(0, state.onboardingController.current-1)); }
    if(action==='finishOnboarding'){
      store.profile.topSize=document.getElementById('onbTop').value; store.profile.bottomSize=document.getElementById('onbTop').value; store.profile.shoeSize=document.getElementById('onbShoe').value; store.onboarded=true; if(!store.wardrobe.length) store.wardrobe=seedWardrobe(state.catalog); saveStore(); document.getElementById('onboarding').classList.remove('show'); renderScreens(); toast('STYLE OS готов к работе');
    }
  }
  async function init(){
    store=newUserStore();
    state.catalog=embeddedCatalog;
    document.getElementById('onboarding').classList.remove('show');
    buildOnboarding();
    if(store.forecast?.day===dayKey())state.filters.outfitWeather=store.forecast.mode;
    document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{state.screen=btn.dataset.screen; closeSheet(); renderScreens();}));
    document.getElementById('floatingAdd').onclick=()=>openSheet('addItem');
    window.appAction=appAction;
    window.uploadStyleAvatar=uploadAvatar;
    window.styleAuth={display:authDisplay,submit:authSubmit,logout:logoutAccount};
    startAuth().catch(err=>{authDisplay();authMessage("Ошибка инициализации: "+authFriendly(err));});
  }
  init();
</script>
</body>
</html>
